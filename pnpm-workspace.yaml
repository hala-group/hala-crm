packages:
  - apps/*
  - packages/*
blockExoticSubdeps: false
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  argon2: true
  mongodb-memory-server: true
  '@whiskeysockets/baileys': true
  protobufjs: true
  ffmpeg-static: true
  cpu-features: false
  ssh2: false
minimumReleaseAgeExclude:
  - mongoose@9.11.4
  - mquery@6.0.1
  - bullmq@6.4.1
  - '@nestjs/event-emitter@12.0.2'
  - '@nestjs/schedule@12.0.3'
  - '@playwright/test@1.65.0'
  - playwright-core@1.65.0
  - playwright@1.65.0
  - '@nestjs/common@12.4.0'
  - '@nestjs/core@12.4.0'
  - '@nestjs/platform-express@12.4.0'
  - '@nestjs/platform-socket.io@12.4.0'
  - '@nestjs/websockets@12.4.0'
  - '@nestjs/testing@12.4.0'
  - '@nestjs/mongoose@12.0.1'
  - '@nestjs/swagger@12.1.1'
  - bullmq@6.7.1
