services:
  mongo:
    image: mongo:8
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: { context: ., dockerfile: Dockerfile, target: api }
    env_file: .env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/hala_crm
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_PATH: /app/storage
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
    volumes: [media_data:/app/storage]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    build: { context: ., dockerfile: Dockerfile, target: worker }
    env_file: .env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/hala_crm
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_PATH: /app/storage
    volumes: [media_data:/app/storage]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    init: true
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: Dockerfile, target: web }
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  mongo_data:
  redis_data:
  media_data:
